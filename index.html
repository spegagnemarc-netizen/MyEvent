<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyEvent V3</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#07111b;color:#fff;margin:0}.app{max-width:430px;margin:auto;padding:20px}.card{background:#102131;border:1px solid #28445b;border-radius:18px;padding:16px;margin:12px 0}input,textarea{width:100%;box-sizing:border-box;background:#0b1824;color:#fff;border:1px solid #2b465d;border-radius:12px;padding:12px;margin:6px 0 10px}button{background:#278cff;color:#fff;border:0;border-radius:12px;padding:12px 15px;font-weight:700}button.secondary{background:transparent;border:1px solid #36536a}.row{display:flex;gap:8px}.row>*{flex:1}.muted{color:#9eb2c4;font-size:13px}.hidden{display:none}.msg{background:#142b3d;padding:10px;border-radius:14px;margin:8px 0}.me{background:#126fdf;margin-left:15%}.err{color:#ff9999}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<div class="app"><h1>My<span style="color:#278cff">Event</span></h1>
<section id="setup" class="card"><h2>Connexion</h2><p class="muted">Project URL déjà renseignée. Ta clé reste dans ton navigateur.</p><input id="url" value="https://nxxvadbliinhvkirqkkl.supabase.co"><input id="key" type="password" placeholder="Publishable key (sb_publishable_…)"><button onclick="connect()">Connecter</button><p id="status" class="muted"></p></section>
<section id="auth" class="card hidden"><h2>Ton compte</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Mot de passe"><div class="row"><button onclick="signup()">Créer</button><button class="secondary" onclick="login()">Connexion</button></div><p id="authmsg" class="muted"></p></section>
<section id="main" class="hidden"><div class="card"><b id="who">Utilisateur</b> <button class="secondary" onclick="logout()">Déconnexion</button></div>
<div class="card"><h2>🎉 Événement</h2><input id="ename" placeholder="Nom de l’événement"><input id="place" placeholder="Lieu"><button onclick="createEvent()">Créer</button><p id="eventmsg" class="muted"></p></div>
<div class="card"><h2>💬 Discussion</h2><div id="messages"></div><div class="row"><input id="message" placeholder="Écrire un message…"><button onclick="sendMessage()">Envoyer</button></div></div>
<div class="card"><h2>📊 Sondage</h2><input id="question" placeholder="Question"><input id="options" placeholder="Choix séparés par des virgules"><button onclick="createPoll()">Créer le sondage</button><div id="polls"></div></div></section></div>
<script>
let sb,user,event;
const $=x=>document.getElementById(x);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function connect(){try{sb=window.supabase.createClient($('url').value,$('key').value);let r=await sb.auth.getSession();$('setup').classList.add('hidden');r.data.session?show(r.data.session.user):$('auth').classList.remove('hidden')}catch(e){$('status').textContent=e.message;$('status').className='err'}}
async function signup(){let r=await sb.auth.signUp({email:$('email').value,password:$('password').value});$('authmsg').textContent=r.error?r.error.message:'Compte créé. Vérifie ton email puis connecte-toi.'}
async function login(){let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('authmsg').textContent=r.error.message;return}show(r.data.user)}
async function show(u){user=u;$('auth').classList.add('hidden');$('main').classList.remove('hidden');let p=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();if(!p.data)await sb.from('profiles').insert({id:u.id,display_name:u.email.split('@')[0],username:u.email.split('@')[0]});$('who').textContent=p.data?.display_name||u.email;let e=await sb.from('events').select('*').eq('creator_id',u.id).order('created_at',{ascending:false}).limit(1);if(e.data?.length)event=e.data[0];else{let x=await sb.from('events').insert({creator_id:u.id,name:'Mon premier événement'}).select().single();event=x.data;if(event)await sb.from('event_members').insert({event_id:event.id,user_id:u.id,role:'owner'})}loadMessages();loadPolls()}
async function createEvent(){let n=$('ename').value.trim();if(!n)return;$('eventmsg').textContent='Création…';let r=await sb.from('events').insert({creator_id:user.id,name:n,location:$('place').value.trim()}).select().single();if(r.error){$('eventmsg').textContent=r.error.message;return}event=r.data;await sb.from('event_members').insert({event_id:event.id,user_id:user.id,role:'owner'});$('eventmsg').textContent='Événement créé : '+event.name;loadMessages();loadPolls()}
async function loadMessages(){if(!event)return;let r=await sb.from('messages').select('*,profiles(display_name)').eq('event_id',event.id).order('created_at');$('messages').innerHTML=r.error?'<p class="err">'+esc(r.error.message)+'</p>':(r.data||[]).map(m=>`<div class="msg ${m.user_id===user.id?'me':''}"><b>${esc(m.profiles?.display_name||'Membre')}</b><br>${esc(m.content)}</div>`).join('')}
async function sendMessage(){let c=$('message').value.trim();if(!c||!event)return;let r=await sb.from('messages').insert({event_id:event.id,user_id:user.id,content:c});if(r.error)alert(r.error.message);else{$('message').value='';loadMessages()}}
async function createPoll(){let q=$('question').value.trim(),o=$('options').value.split(',').map(x=>x.trim()).filter(Boolean);if(!q||o.length<2)return alert('Question + au moins 2 choix');let p=await sb.from('polls').insert({event_id:event.id,creator_id:user.id,question:q}).select().single();if(p.error)return alert(p.error.message);for(let x of o){let r=await sb.from('poll_options').insert({poll_id:p.data.id,option_text:x});if(r.error)return alert(r.error.message)}$('question').value='';$('options').value='';loadPolls()}
async function loadPolls(){if(!event)return;let r=await sb.from('polls').select('*,poll_options(*)').eq('event_id',event.id).order('created_at',{ascending:false});$('polls').innerHTML=(r.data||[]).map(p=>`<div class="card"><b>${esc(p.question)}</b>${(p.poll_options||[]).map(o=>`<button class="secondary" style="display:block;width:100%;margin-top:7px" onclick="vote('${p.id}','${o.id}')">${esc(o.option_text)}</button>`).join('')}</div>`).join('')}
async function vote(p,o){let r=await sb.from('poll_votes').upsert({poll_id:p,option_id:o,user_id:user.id});if(r.error)alert(r.error.message);else alert('Vote enregistré')}
async function logout(){await sb.auth.signOut();location.reload()}
</script></html>
