<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyEvent</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#07111b;color:#fff;margin:0}
.app{max-width:430px;margin:auto;padding:20px}
.card{background:#102131;border:1px solid #28445b;border-radius:18px;padding:16px;margin:12px 0}
input,textarea{width:100%;box-sizing:border-box;background:#0b1824;color:#fff;border:1px solid #2b465d;border-radius:12px;padding:12px;margin:6px 0 10px;font-size:16px}
button{background:#278cff;color:#fff;border:0;border-radius:12px;padding:12px 15px;font-weight:700;font-size:16px}
button.secondary{background:transparent;border:1px solid #36536a}
button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.muted{color:#9eb2c4;font-size:13px}.hidden{display:none}
.msg{background:#142b3d;padding:10px;border-radius:14px;margin:8px 0}.me{background:#126fdf;margin-left:15%}
.err{color:#ff9999}.ok{color:#7ee2a8}
.notice{padding:10px;border-radius:12px;background:#0b1824;margin:10px 0}
</style>
</head>
<body>
<div class="app">
<h1>My<span style="color:#278cff">Event</span></h1>

<section id="setup" class="card">
<h2>Connexion</h2>
<p class="muted">Project URL déjà renseignée. Ta clé reste dans ton navigateur.</p>
<input id="url" value="https://nxxvadbliinhvkirqkkl.supabase.co">
<input id="key" type="password" placeholder="Publishable key (sb_publishable_…)" autocomplete="off">
<button id="connectBtn" class="hidden">Connecter</button>
<p id="status" class="muted"></p>
</section>

<section id="auth" class="card hidden">
<h2>Ton compte</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Mot de passe">
<div class="row">
<button id="signupBtn">Créer</button>
<button class="secondary" id="loginBtn">Connexion</button>
</div>
<p id="authmsg" class="muted"></p>
</section>

<section id="main" class="hidden">
<div class="card">
<b id="who">Utilisateur</b>
<button class="secondary" id="logoutBtn">Déconnexion</button>
<div id="globalmsg" class="notice muted">Prêt.</div>
</div>

<div class="card">
<h2>🎉 Événement</h2>
<input id="ename" placeholder="Nom de l’événement">
<input id="place" placeholder="Lieu">
<button id="eventBtn">Créer</button>
<p id="eventmsg" class="muted"></p>
</div>

<div class="card" id="inviteCard">
<h2>👥 Inviter</h2>
<p class="muted">Partage ce lien pour permettre à quelqu’un de rejoindre cet événement.</p>
<input id="inviteLink" readonly placeholder="Le lien apparaîtra ici">
<div class="row">
<button id="copyInviteBtn">🔗 Copier le lien</button>
<button class="secondary" id="shareInviteBtn">Partager</button>
</div>
<p id="inviteMsg" class="muted"></p>
</div>

<div class="card" id="joinCard">
<h2>🔗 Rejoindre un événement</h2>
<input id="joinCode" placeholder="Code d’invitation">
<button id="joinBtn">Rejoindre</button>
<p id="joinMsg" class="muted"></p>
</div>

<div class="card">
<h2>💬 Discussion</h2>
<div id="messages"></div>
<div class="row">
<input id="message" placeholder="Écrire un message…">
<button id="sendBtn">Envoyer</button>
</div>
</div>

<div class="card">
<h2>📊 Sondage</h2>
<input id="question" placeholder="Question">
<input id="options" placeholder="Choix séparés par des virgules">
<button id="pollBtn">Créer le sondage</button>
<div id="polls"></div>
</div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let sb=null,user=null,event=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function msg(id,text,type='muted'){ $(id).textContent=text; $(id).className=type; }
function global(text,type='muted'){ msg('globalmsg',text,type); }

function setBusy(id,busy,label){
  const b=$(id);
  b.disabled=busy;
  if(label) b.textContent=label;
}

const SUPABASE_URL='https://nxxvadbliinhvkirqkkl.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_jBqcZF0k-mNBp5HJGxniTQ_gcjkPgMn';

async function connect(){
  msg('status','Connexion à Supabase…');
  try{
    if(!window.supabase) throw new Error('La bibliothèque Supabase ne s’est pas chargée. Recharge la page.');
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
    const r=await sb.auth.getSession();
    if(r.error) throw r.error;
    $('setup').classList.add('hidden');
    if(r.data.session) await show(r.data.session.user);
    else $('auth').classList.remove('hidden');
  }catch(e){
    msg('status',e.message||String(e),'err');
  }
}

async function signup(){
  msg('authmsg','Création du compte…');
  try{
    const r=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value});
    if(r.error) throw r.error;
    msg('authmsg','Compte créé. Vérifie ton email puis connecte-toi.','ok');
  }catch(e){msg('authmsg',e.message||String(e),'err')}
}

async function login(){
  msg('authmsg','Connexion…');
  try{
    const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
    if(r.error) throw r.error;
    await show(r.data.user);
  }catch(e){msg('authmsg',e.message||String(e),'err')}
}

async function show(u){
  user=u;
  $('auth').classList.add('hidden');
  $('main').classList.remove('hidden');
  global('Chargement de ton événement…');

  try{
    const p=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
    if(p.error) throw new Error('Profil : '+p.error.message);

    if(!p.data){
      const name=(u.email||'membre').split('@')[0];
      const pr=await sb.from('profiles').upsert({
        id:u.id,display_name:name,username:name
      },{onConflict:'id'}).select().single();
      if(pr.error) throw new Error('Création du profil : '+pr.error.message);
      $('who').textContent=name;
    }else $('who').textContent=p.data.display_name||u.email;

    const e=await sb.from('events').select('*').eq('creator_id',u.id).order('created_at',{ascending:false}).limit(1);
    if(e.error) throw new Error('Événement : '+e.error.message);

    if(e.data?.length){
      event=e.data[0];
    }else{
      const x=await sb.from('events').insert({
        creator_id:u.id,name:'Mon premier événement'
      }).select().single();
      if(x.error) throw new Error('Création de l’événement initial : '+x.error.message);
      event=x.data;
      const m=await sb.from('event_members').upsert({
        event_id:event.id,user_id:u.id,role:'owner'
      },{onConflict:'event_id,user_id'});
      if(m.error) throw new Error('Membre : '+m.error.message);
    }

    global('Connecté • événement actif : '+event.name,'ok');
    updateInviteUI();
    await handleJoinLink();
    await Promise.all([loadMessages(),loadPolls()]);
  }catch(e){
    global(e.message||String(e),'err');
  }
}

function updateInviteUI(){
  if(!event)return;
  const code=event.invite_code||'';
  if(code){
    const link=location.origin+location.pathname+'?join='+encodeURIComponent(code);
    $('inviteLink').value=link;
  }else{
    $('inviteLink').value='';
  }
}

async function copyInvite(){
  if(!event?.invite_code){msg('inviteMsg','Aucun code d’invitation pour cet événement.','err');return}
  const link=location.origin+location.pathname+'?join='+encodeURIComponent(event.invite_code);
  try{
    await navigator.clipboard.writeText(link);
    msg('inviteMsg','Lien copié. Tu peux l’envoyer à tes invités.','ok');
  }catch(e){
    $('inviteLink').select();
    msg('inviteMsg','Sélectionne le lien puis copie-le.','muted');
  }
}

async function shareInvite(){
  if(!event?.invite_code)return;
  const link=location.origin+location.pathname+'?join='+encodeURIComponent(event.invite_code);
  try{
    if(navigator.share){
      await navigator.share({title:'Rejoins mon événement MyEvent',text:'Rejoins mon événement sur MyEvent',url:link});
    }else await copyInvite();
  }catch(e){ if(e?.name!=='AbortError') msg('inviteMsg',e.message||String(e),'err'); }
}

async function joinEvent(code){
  code=(code||'').trim();
  if(!code){msg('joinMsg','Entre un code d’invitation.','err');return}
  if(!user||!sb){msg('joinMsg','Connecte-toi d’abord.','err');return}
  setBusy('joinBtn',true,'Connexion…');
  try{
    const r=await sb.rpc('join_event_by_code',{p_code:code});
    if(r.error)throw r.error;
    const row=r.data?.[0];
    if(!row)throw new Error('Événement introuvable.');
    event={id:row.joined_event_id ?? row.event_id,name:row.event_name,location:row.event_location,invite_code:code};
    $('ename').value=event.name||'';
    $('place').value=event.location||'';
    updateInviteUI();
    $('joinCode').value='';
    msg('joinMsg','Événement rejoint : '+event.name,'ok');
    global('Événement actif : '+event.name,'ok');
    updateInviteUI();
    await Promise.all([loadMessages(),loadPolls()]);
  }catch(e){msg('joinMsg','Erreur : '+(e.message||String(e)),'err')}
  finally{setBusy('joinBtn',false,'Rejoindre')}
}

async function handleJoinLink(){
  const code=new URLSearchParams(location.search).get('join');
  if(code){
    $('joinCode').value=code;
    msg('joinMsg','Lien d’invitation détecté. Appuie sur « Rejoindre ».','ok');
  }
}

async function createEvent(){
  if(!user || !sb){msg('eventmsg','Pas connecté à Supabase.','err');return}
  const n=$('ename').value.trim(), place=$('place').value.trim();
  if(!n){msg('eventmsg','Indique un nom d’événement.','err');return}
  setBusy('eventBtn',true,'Création…');
  try{
    const r=await sb.from('events').insert({
      creator_id:user.id,name:n,location:place,invite_code:undefined
    }).select().single();
    if(r.error) throw r.error;
    event=r.data;

    const m=await sb.from('event_members').upsert({
      event_id:event.id,user_id:user.id,role:'owner'
    },{onConflict:'event_id,user_id'});
    if(m.error) throw m.error;

    msg('eventmsg','Événement créé : '+event.name,'ok');
    global('Événement actif : '+event.name,'ok');
    updateInviteUI();
    await Promise.all([loadMessages(),loadPolls()]);
  }catch(e){
    msg('eventmsg','Erreur : '+(e.message||String(e)),'err');
  }finally{setBusy('eventBtn',false,'Créer')}
}

async function loadMessages(){
  if(!event)return;
  const r=await sb.from('messages').select('*').eq('event_id',event.id).order('created_at',{ascending:true});
  if(r.error){$('messages').innerHTML='<p class="err">'+esc(r.error.message)+'</p>';return}
  $('messages').innerHTML=(r.data||[]).map(m=>
    '<div class="msg '+(m.user_id===user.id?'me':'')+'"><b>'+
    (m.user_id===user.id?'Moi':'Membre')+'</b><br>'+esc(m.content)+'</div>'
  ).join('');
}

async function sendMessage(){
  if(!event){alert('Aucun événement actif. Recharge la page.');return}
  const c=$('message').value.trim();
  if(!c)return;
  setBusy('sendBtn',true,'…');
  try{
    const r=await sb.from('messages').insert({
      event_id:event.id,user_id:user.id,content:c
    });
    if(r.error) throw r.error;
    $('message').value='';
    await loadMessages();
  }catch(e){alert('Erreur message : '+(e.message||String(e)))}
  finally{setBusy('sendBtn',false,'Envoyer')}
}

async function createPoll(){
  if(!event){alert('Aucun événement actif. Recharge la page.');return}
  const q=$('question').value.trim();
  const o=$('options').value.split(',').map(x=>x.trim()).filter(Boolean);
  if(!q||o.length<2){alert('Question + au moins 2 choix');return}
  setBusy('pollBtn',true,'Création…');
  try{
    const p=await sb.from('polls').insert({
      event_id:event.id,creator_id:user.id,question:q
    }).select().single();
    if(p.error) throw p.error;

    for(const x of o){
      const r=await sb.from('poll_options').insert({
        poll_id:p.data.id,option_text:x
      });
      if(r.error) throw r.error;
    }
    $('question').value='';
    $('options').value='';
    await loadPolls();
    global('Sondage créé.','ok');
  }catch(e){alert('Erreur sondage : '+(e.message||String(e)))}
  finally{setBusy('pollBtn',false,'Créer le sondage')}
}

async function loadPolls(){
  if(!event)return;
  const r=await sb.from('polls').select('*,poll_options(*)')
    .eq('event_id',event.id).order('created_at',{ascending:false});
  if(r.error){$('polls').innerHTML='<p class="err">'+esc(r.error.message)+'</p>';return}
  $('polls').innerHTML=(r.data||[]).map(p=>
    '<div class="card"><b>'+esc(p.question)+'</b>'+
    (p.poll_options||[]).map(o=>
      '<button class="secondary voteBtn" data-poll="'+p.id+'" data-option="'+o.id+
      '" style="display:block;width:100%;margin-top:7px">'+esc(o.option_text)+'</button>'
    ).join('')+'</div>'
  ).join('');

  document.querySelectorAll('.voteBtn').forEach(b=>{
    b.addEventListener('click',()=>vote(b.dataset.poll,b.dataset.option));
  });
}

async function vote(p,o){
  try{
    const r=await sb.from('poll_votes').upsert(
      {poll_id:p,option_id:o,user_id:user.id},
      {onConflict:'poll_id,user_id'}
    );
    if(r.error)throw r.error;
    alert('Vote enregistré');
  }catch(e){alert('Erreur vote : '+(e.message||String(e)))}
}

async function logout(){await sb.auth.signOut();location.reload()}

$('connectBtn').addEventListener('click',connect);
window.addEventListener('load',()=>connect());
$('signupBtn').addEventListener('click',signup);
$('loginBtn').addEventListener('click',login);
$('eventBtn').addEventListener('click',createEvent);
$('sendBtn').addEventListener('click',sendMessage);
$('pollBtn').addEventListener('click',createPoll);
$('logoutBtn').addEventListener('click',logout);
$('copyInviteBtn').addEventListener('click',copyInvite);
$('shareInviteBtn').addEventListener('click',shareInvite);
$('joinBtn').addEventListener('click',()=>joinEvent($('joinCode').value));
$('joinCode').addEventListener('keydown',e=>{if(e.key==='Enter')joinEvent($('joinCode').value)});
</script>
</body>
</html>
