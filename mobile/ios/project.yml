name: MyEventMobile
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: app.myevent.mobile.dev
    CODE_SIGN_STYLE: Automatic
targets:
  MyEventMobile:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../bridge/native-camera.js
        buildPhase: resources
      - path: Resources
        buildPhase: resources
      - path: ../../assets/camera-me-logo.jpeg
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: MyEvent
        UILaunchScreen: {}
        NSCameraUsageDescription: Prendre une photo pour MyEvent après votre accord.
        NSMicrophoneUsageDescription: Utiliser le microphone pour les appels et vidéos MyEvent après votre accord.
        NSLocationWhenInUseUsageDescription: Rechercher les lieux autour de vous dans MyEvent après votre accord.
        NSPhotoLibraryAddUsageDescription: Enregistrer votre photo MyEvent dans Photos après votre accord.
        MyEventWebURL: https://my-event-ii2zetly5-spegagnemarc-netizen.vercel.app/index.html
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: NO
  MyEventMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: MyEventMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MyEventMobile:
    build:
      targets:
        MyEventMobile: all
        MyEventMobileTests: [test]
    test:
      targets:
        - MyEventMobileTests
