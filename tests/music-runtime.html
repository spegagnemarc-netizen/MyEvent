<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music runtime regression tests</title><link rel="stylesheet" href="../css/inline-extracted.css">
<style>body{background:#080b10;color:white}#testResults{white-space:pre-wrap;padding:20px}#musicHome{position:relative;display:block;inset:auto;padding:16px}#socialBottomNav{position:relative;display:block}</style>
<pre id="testResults">Tests en attente</pre><button id="runTests">Exécuter les tests</button>
<div id="socialHome"></div><nav id="socialBottomNav"><button data-bottom-tab="music">Musique</button></nav>
<section id="musicHome"><button id="musicBackBtn">Retour accueil</button><input id="musicSearchInput" type="search" aria-label="Recherche"><button id="musicSearchBtn">Rechercher</button><button data-music-action="event">Playlist événement</button><button data-music-action="favorites">Mes favoris</button><div id="musicTrending" class="musicCards"></div><p id="musicProviderStatus"></p></section>
<script>
const cover='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="600" height="600" fill="#34445d"/><circle cx="300" cy="280" r="150" fill="#a1819e"/><text x="300" y="470" text-anchor="middle" fill="white" font-size="44">CÉLINE DION</text></svg>');
const tracks=[{provider:'youtube',provider_track_id:'videoA',title:'Pour que tu m&#39;aimes encore',artist:'Céline &amp; René',thumbnail_url:cover},{provider:'youtube',provider_track_id:'videoB',title:'L&#x2019;été &quot;live&quot; &lt;3',artist:'Chœur &amp; invités',thumbnail_url:cover},{provider:'youtube',provider_track_id:'videoC',title:'</textarea><img src=x onerror=alert(1)> &lt;script&gt; &#39;',artist:'A & B',thumbnail_url:cover}];
const db={music_tracks:[],music_favorites:[],music_playlist_items:[]};let hasEvent=false,signedIn=true,failFavorite=false,shared=null;const calls=[];
window.fetch=async()=>({ok:true,json:async()=>({items:tracks})});
Object.defineProperty(navigator,'share',{configurable:true,value:async data=>{shared=data;}});
const sb={from(table){let action='select',value,columns='',filters=[];const query={select(v){columns=v;return query},eq(k,v){filters.push([k,v]);return query},order(){return query},limit(){return query},insert(v){action='insert';value=v;return query},delete(){action='delete';return query},upsert(v){action='upsert';value=v;return query},maybeSingle(){return execute(true)},single(){return execute(true)},then(resolve,reject){return execute(false).then(resolve,reject)}};
async function execute(single){
 calls.push({table,action,value,filters});if(table==='music_favorites'&&failFavorite)return {error:{message:'Accès refusé'}};
 if(table==='music_playlists')return {data:{id:'playlist',name:'Playlist test'}};
 if(table==='music_votes')return {data:null};
 const rows=db[table],match=row=>filters.every(([k,v])=>row[k]===v);
 if(action==='insert'){
  const duplicate=rows.some(row=>table==='music_tracks'?row.provider_track_id===value.provider_track_id:table==='music_favorites'?row.user_id===value.user_id&&row.track_id===value.track_id:row.track_id===value.track_id&&row.playlist_id===value.playlist_id);
  if(duplicate)return {error:{code:'23505',message:'Duplicate'}};
  const row={id:table+rows.length,...value};rows.push(row);return {data:single?row:[row]};
 }
 if(action==='delete'){db[table]=rows.filter(row=>!match(row));return {data:null};}
 let data=rows.filter(match);if(columns.includes('track:'))data=data.map(row=>({...row,track:db.music_tracks.find(t=>t.id===row.track_id),votes:[],created_at:'2026',position:0}));
 return {data:single?data[0]||null:data};
}return query;}};
window.myeventMusicContext=()=>({sb,user:signedIn?{id:'user'}:null,event:hasEvent?{id:'event'}:null});
</script><script src="../js/music-runtime.js"></script>
<script>
const $=s=>document.querySelector(s),tick=()=>new Promise(r=>setTimeout(r,0));
async function click(s){const e=$(s);if(!e)throw Error('Missing '+s);e.click();await tick();}
function assert(ok,message){if(!ok)throw Error(message);}
async function run(){const results=[];try{
 await click('[data-bottom-tab="music"]');$('#musicSearchInput').value='Céline';await click('#musicSearchBtn');
 assert($('.musicSearchResult strong').textContent==="Pour que tu m'aimes encore",'decimal entity');assert($('.musicSearchResult small').textContent==='Céline & René','named entity');
 assert(document.querySelectorAll('.musicSearchResult')[1].querySelector('strong').textContent==='L’été "live" <3','hex and quotes');assert(document.querySelectorAll('.musicSearchResult')[2].querySelector('strong').textContent===`</textarea><img src=x onerror=alert(1)> <script> '`,'literal markup');assert(!$('.musicSearchResult strong img'),'no HTML injection');results.push('PASS metadata: decimal, hex, named, literal markup');
 for(const s of ['.musicSearchResult img','.musicSearchResult strong','.musicSearchResult']){await click(s);assert($('#musicPlayer.open'),'open player');assert($('.musicPlayerMeta h2').textContent==="Pour que tu m'aimes encore",'player decoded');await click('[data-player-close]');}
 await click('[data-music-add]');assert(!$('#musicPlayer.open'),'add must not open');assert($('#musicProviderStatus').textContent.includes('Ouvre'),'event required');
 await click('.musicSearchResult');await click('[data-player-play]');assert(!$('.musicPlayerCover'),'cover replaced');assert($('#musicPlayer iframe').src.includes('/embed/videoA?'),'correct embed');assert($('#musicPlayer iframe').title==="Pour que tu m'aimes encore",'iframe decoded');await click('[data-player-close]');assert(!$('#musicPlayer iframe'),'closed playback removed');results.push('PASS open from cover/title/card, single media, close stops playback');
 await click('.musicSearchResult');await click('[data-player-fav]');assert(db.music_favorites.length===1,'favorite created without event');assert($('[data-player-fav]').getAttribute('aria-pressed')==='true','favorite selected');await click('[data-player-share]');assert(shared.title==="Pour que tu m'aimes encore"&&shared.text==='Céline & René','share decoded');
 await click('[data-player-close]');await click('[data-music-action="favorites"]');assert($('.musicFavoriteRow strong').textContent==="Pour que tu m'aimes encore",'favorites decoded');await click('.musicFavoriteRow');assert($('[data-player-fav]').getAttribute('aria-pressed')==='true','favorite restored');failFavorite=true;await click('[data-player-fav]');assert($('[data-player-fav]').getAttribute('aria-pressed')==='true','failed delete retains state');assert($('#musicPlayerStatus').textContent.includes('Accès refusé'),'visible failure');failFavorite=false;await click('[data-player-fav]');assert(db.music_favorites.length===0,'favorite removed');assert($('#musicFavoritesPanel .musicEmpty'),'list refreshed');results.push('PASS favorites add/reopen/list/remove, error state, share metadata');
 hasEvent=true;await click('[data-player-add]');assert(db.music_playlist_items.length===1,'playlist add');assert($('[data-player-add] span').textContent==='Ajouté','action label retained');await click('[data-player-close]');assert($('.musicQueueRow strong').textContent==="Pour que tu m'aimes encore",'saved metadata decoded');await click('[data-music-vote]');assert(!$('#musicPlayer.open'),'vote must not open');assert(calls.filter(c=>c.table==='music_votes').length===1,'single vote');await click('.musicQueueRow strong');assert($('.musicPlayerMeta h2').textContent==="Pour que tu m'aimes encore",'playlist opens player');await click('[data-player-add]');assert($('#musicPlayerStatus').textContent.includes('déjà'),'duplicate handled');assert($('[data-player-add] span').textContent==='Playlist'&&!$('[data-player-add]').disabled,'failed add restores action');results.push('PASS playlist add/open/duplicate and isolated vote');
 await click('[data-player-close]');await click('.musicSearchResult');assert($('.musicRelatedCard b').textContent==='L’été "live" <3','related decoded');await click('.musicRelatedCard');assert($('.musicPlayerMeta h2').textContent==='L’été "live" <3','related opens');await click('[data-player-play]');await click('#musicBackBtn');assert(!$('#musicPlayer iframe'),'leaving music stops playback');
 signedIn=false;await click('.musicSearchResult');await click('[data-player-fav]');assert($('#musicPlayerStatus').textContent.includes('Connecte-toi'),'signed out message');await click('[data-player-close]');signedIn=true;results.push('PASS related selection, leaving music, signed-out favorite');
 $('#testResults').textContent=results.join('\n')+'\nALL PASS';
}catch(e){$('#testResults').textContent=results.join('\n')+'\nFAIL '+e.stack;}}
$('#runTests').onclick=run;
if(new URLSearchParams(location.search).has('run'))run();
</script></html>
