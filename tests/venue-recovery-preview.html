<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ORÉVAMI TEST · Fiches des lieux</title><link rel="stylesheet" href="../css/activities.css"><style>body{background:#071622;color:#edf4ff;font:16px/1.5 system-ui;margin:0;padding:48px 20px}main{max-width:1100px;margin:auto}#outingResults{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}button{cursor:pointer}input{padding:12px;border-radius:12px;max-width:90%}#status{color:#adc8dd}</style></head><body><main hidden><h1>Découvrir un lieu à Gap</h1><p>TEST · données publiques réelles · aucun événement ni compte créé.</p><form id="search"><label>Rechercher dans les résultats <input name="q" type="search" placeholder="Nom du lieu"></label></form><p id="status" role="status">Chargement…</p><div id="outingResults"></div><p id="selection" role="status"></p></main><script src="../js/activities-core.js"></script><script src="../js/place-card.js"></script><script src="../js/activity-venue-sheet.js"></script><script src="../js/restaurant-information.js"></script><script>
(async()=>{const status=document.getElementById('status'),list=document.getElementById('outingResults');try{const config=await fetch('/api/runtime-config',{cache:'no-store',credentials:'same-origin'}).then(r=>r.json());if(config.environment!=='preview'||config.isTest!==true||config.projectRef!=='ahyyknfjsielnqyoxqgh')throw Error('Présentation réservée au TEST.');document.querySelector('main').hidden=false;const r=await fetch('/api/search-places?mode=restaurant&lat=44.559&lon=6.079&radius=5',{credentials:'same-origin'}),data=await r.json();if(!r.ok)throw Error(data.error||'Recherche indisponible');const rows=data.results;function draw(){const q=document.forms.search.elements.q.value.toLocaleLowerCase('fr');const visible=rows.filter(v=>v.name.toLocaleLowerCase('fr').includes(q));list.innerHTML=visible.map(v=>MyEventPlaceCard.restaurantMiniature(v)).join('');status.textContent=visible.length+' lieux réels · ouvrez une fiche pour voir les informations disponibles.';}document.forms.search.addEventListener('submit',e=>e.preventDefault());document.forms.search.elements.q.addEventListener('input',draw);list.addEventListener('click',e=>{const b=e.target.closest('[data-outing-select]');if(!b)return;const v=rows.find(v=>String(v.id)===b.dataset.outingSelect);if(v)document.getElementById('selection').textContent='Lieu ajouté au formulaire de test : '+v.name+' · aucun enregistrement effectué.';});draw();}catch(e){document.querySelector('main').hidden=false;status.textContent=e.message;}})();
</script></body></html>
